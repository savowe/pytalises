[build-system]
requires = ["setuptools>=65.5", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "pytalises"
version = "0.2.7"
description = "TALISES (This Ain't a LInear Schrödinger Equation Solver) is an easy-to-use Python implementation of the Split-Step Fourier Method for time-propagation under the Schrödinger equation."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Sascha Vowe", email = "sascha.vowe@posteo.de" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Physics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "numpy>=1.26.4,<2.0; python_version<'3.13'",
  "numpy>=2.1.0; python_version>='3.13'",
  "scipy>=1.10.1,<1.11; python_version<'3.10'",
  "scipy>=1.11.4,<1.14; python_version>='3.10' and python_version<'3.13'",
  "scipy>=1.14.0; python_version>='3.13'",
  "numba>=0.59.1; python_version<'3.12'",
  "numba>=0.60.0; python_version>='3.12'",
  "pyfftw>=0.13.1",
  "numexpr>=2.8.4",
]

[project.urls]
Homepage = "http://github.com/savowe/pytalises"
Repository = "http://github.com/savowe/pytalises"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "D"]
ignore = ["E203", "D100", "D103", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["pytalises", "pytalises.*"]
